<!-- TiviMate-style channel row -->
<div *ngIf="layout === 'row'" id="tile-{{ id }}" tabindex="-1" class="row-item" [class.playing]="isPlaying"
  [class.faded]="fade" [title]="channel?.name" (click)="click()" (contextmenu)="onRightClick($event)"
  (appInView)="loadEpg()">
  <span class="num" *ngIf="number">{{ number }}</span>
  <div class="logo">
    <img *ngIf="channel?.image && showImage" [src]="channel?.image" loading="lazy" (error)="showImage = false" />
    <span *ngIf="!channel?.image || !showImage" class="logo-fallback">{{ initials }}</span>
  </div>
  <div class="text">
    <div class="name">{{ channel?.name }}</div>
    <div class="sub" *ngIf="now">{{ now.title }}</div>
    <div class="sub dim" *ngIf="!now && getSourceName()">{{ getSourceName() }}</div>
    <div class="bar" *ngIf="now"><div [style.width.%]="progress * 100"></div></div>
  </div>
  <div class="badges">
    <svg *ngIf="channel?.tv_archive === true" viewBox="0 0 24 24"><title>Catch-up</title>
      <path d="M13.5 8H12v5l4.28 2.54.72-1.21-3.5-2.08V8M13 3a9 9 0 0 0-9 9H1l3.96 4.03L9 12H6a7 7 0 0 1 7-7 7 7 0 0 1 7 7 7 7 0 0 1-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.9 8.9 0 0 0 13 21a9 9 0 0 0 9-9 9 9 0 0 0-9-9" />
    </svg>
    <svg *ngIf="channel?.favorite" class="fav" viewBox="0 0 24 24"><title>Favorite</title>
      <path d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z" />
    </svg>
  </div>
</div>

<!-- VOD poster card (movies, series, seasons) -->
<div *ngIf="layout === 'poster'" id="tile-{{ id }}" tabindex="-1" class="poster" [class.playing]="isPlaying"
  [class.faded]="fade" [title]="channel?.name" (click)="click()" (contextmenu)="onRightClick($event)">
  <div class="art">
    <img *ngIf="channel?.image && showImage" [src]="channel?.image" loading="lazy" (error)="showImage = false" />
    <span *ngIf="!channel?.image || !showImage" class="logo-fallback">{{ initials }}</span>
    <svg *ngIf="channel?.favorite" class="fav" viewBox="0 0 24 24">
      <path d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z" />
    </svg>
  </div>
  <div class="title">{{ channel?.name }}</div>
</div>

<div style="visibility: hidden; position: fixed" [style.left.px]="menuTopLeftPosition.x"
  [style.top.px]="menuTopLeftPosition.y" [matMenuTriggerFor]="rightMenu"></div>

<mat-menu #rightMenu="matMenu">
  <ng-template matMenuContent let-item="item">
    <button [hidden]="viewMode != viewModeEnum.History" mat-menu-item (click)="removeFromHistory()">
      Remove
    </button>
    <button [hidden]="
        channel?.media_type == mediaTypeEnum.group || channel?.media_type == mediaTypeEnum.season || viewMode == viewModeEnum.History
      " mat-menu-item (click)="favorite()">
      <ng-container *ngIf="alreadyExistsInFav">Unfavorite</ng-container>
      <ng-container *ngIf="!alreadyExistsInFav">Favorite</ng-container>
    </button>
    <button [hidden]="isCustom() || viewMode == viewModeEnum.History" mat-menu-item (click)="hide()"> <ng-container
        *ngIf="alreadyHidden">Unhide</ng-container>
      <ng-container *ngIf="!alreadyHidden">Hide</ng-container>
    </button>
    <button [hidden]="!isLivestream()" mat-menu-item (click)="record()">Record</button>
    <button [hidden]="!isMovie() || downloading" mat-menu-item (click)="downloadVod()">
      Download
    </button>
    <button [hidden]="!isMovie() || !downloading" mat-menu-item (click)="cancelDownload()">
      Cancel download
    </button>
    <button [hidden]="!showEPG()" mat-menu-item (click)="showEPGModal()">EPG</button>
    <button [hidden]="!isCustom()" mat-menu-item (click)="edit()">Edit</button>
    <button [hidden]="!isCustom()" mat-menu-item (click)="share()">Share</button>
    <button [hidden]="!isLivestream()" mat-menu-item (click)="openRestreamModal()">
      Re-stream
    </button>
    <button mat-menu-item
      [hidden]="channel?.media_type == mediaTypeEnum.group || channel?.media_type == mediaTypeEnum.season"
      (click)="copyURL()">Copy URL</button>
    <button [hidden]="!isCustom()" mat-menu-item (click)="delete()">Delete</button>
  </ng-template>
</mat-menu>
